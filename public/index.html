<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список дел</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>Список дел</h1>

    <section class="card" id="auth-card">
      <label for="token">Токен доступа (Bearer)</label>
      <div class="row">
        <input type="password" id="token" placeholder="Введите токен" autocomplete="off" />
        <button id="connect">Войти</button>
      </div>
      <p class="muted" id="author"></p>
      <p class="error" id="auth-error"></p>
    </section>

    <section class="card hidden" id="app-card">
      <div class="row">
        <label for="runId">runId:</label>
        <input type="text" id="runId" value="ui" />
        <button id="refresh">Обновить</button>
      </div>

      <form id="add-form" class="row">
        <input type="text" id="new-title" placeholder="Новое дело" maxlength="200" required />
        <button type="submit">Добавить</button>
      </form>

      <ul id="tasks"></ul>
      <p class="error" id="app-error"></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
